[project]
name = "autoworldbench"
version = "1.0.0"
description = "AutoWorldModel-Bench: a benchmark framework for evaluating AI coding agents on world-model research tasks"
requires-python = ">=3.12"
license = {text = "MIT"}
dependencies = [
    "numpy>=1.24,<3",
    "torch>=2.0,<2.7",
    "pyarrow>=14.0",
    "huggingface-hub>=0.20",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
harbor = ["harbor>=0.3.0"]
agent = ["anthropic>=0.39", "psutil>=5.9"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["lib"]

[tool.uv]
index-url = "https://download.pytorch.org/whl/cu124"
extra-index-url = ["https://pypi.org/simple"]

[tool.ruff]
line-length = 100
target-version = "py312"
