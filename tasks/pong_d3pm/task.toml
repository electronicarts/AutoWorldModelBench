version = "1.1"

[task]
name = "autoworldbench/pong_d3pm"
description = "Maximize composite score for pong using d3pm world model"
authors = [{name = "AutoWorldBench"}]
keywords = ["pong", "d3pm", "continuous-physics", "discrete-model", "world-model", "autoworldbench"]

[metadata]
game_id = "pong"
model_type = "d3pm"
difficulty = "easy"
category = "world_model_research"

[verifier]
timeout_sec = 300.0
user = "root"

[agent]
timeout_sec = 28800.0
user = "agent"

[environment]
build_timeout_sec = 600.0
cpus = 4
memory_mb = 235520
storage_mb = 51200
gpus = 0
allow_internet = true

[environment.env]
TASK_ID = "pong_d3pm"
GAME_ID = "pong"
MODEL_TYPE = "d3pm"
