version = "1.1"

[task]
name = "autoworldbench/platformer_dreamer"
description = "Maximize composite score for platformer using dreamer world model"
authors = [{name = "AutoWorldBench"}]
keywords = ["platformer", "dreamer", "continuous-model", "world-model", "autoworldbench"]

[metadata]
game_id = "platformer"
model_type = "dreamer"
difficulty = "medium"
category = "world_model_research"

[verifier]
timeout_sec = 300.0
user = "root"

[agent]
timeout_sec = 28800.0
user = "agent"

[environment]
build_timeout_sec = 600.0
cpus = 4
memory_mb = 235520
storage_mb = 51200
gpus = 0
allow_internet = true

[environment.env]
TASK_ID = "platformer_dreamer"
GAME_ID = "platformer"
MODEL_TYPE = "dreamer"
