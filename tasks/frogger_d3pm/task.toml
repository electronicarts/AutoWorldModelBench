version = "1.1"

[task]
name = "autoworldbench/frogger_d3pm"
description = "Maximize composite score for frogger using d3pm world model"
authors = [{name = "AutoWorldBench"}]
keywords = ["frogger", "d3pm", "discrete-grid", "discrete-model", "world-model", "autoworldbench"]

[metadata]
game_id = "frogger"
model_type = "d3pm"
difficulty = "hard"
category = "world_model_research"

[verifier]
timeout_sec = 300.0
user = "root"

[agent]
timeout_sec = 28800.0
user = "agent"

[environment]
build_timeout_sec = 600.0
cpus = 4
memory_mb = 235520
storage_mb = 51200
gpus = 0
allow_internet = true

[environment.env]
TASK_ID = "frogger_d3pm"
GAME_ID = "frogger"
MODEL_TYPE = "d3pm"
